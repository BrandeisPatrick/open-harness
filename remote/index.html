<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf9f5">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#262624">
<meta name="apple-mobile-web-app-title" content="OpenAgent">
<meta name="robots" content="noindex, nofollow">
<title>OpenAgent</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<header class="top">
  <button type="button" id="open-sessions" class="icon-btn" aria-label="Sessions" aria-haspopup="dialog" aria-controls="sheet">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
  </button>
  <div class="top-title">
    <span id="mark" class="mark idle" role="img" aria-label="Idle"></span>
    <h1 id="title">OpenAgent</h1>
  </div>
  <span id="model" class="top-model"></span>
</header>

<div id="conn" class="conn" hidden role="status"><span class="spinner sm"></span><span>Reconnecting…</span></div>

<main id="scroll" class="scroll">
  <div id="transcript" class="col" aria-live="polite"></div>
</main>

<footer class="composer-wrap">
  <div id="tasks" class="tasks col" hidden></div>
  <div id="queue" class="queue col" hidden></div>
  <div id="toast" class="toast col" hidden role="alert"></div>
  <div class="composer col">
    <textarea id="input" rows="1" placeholder="Message OpenAgent" enterkeyhint="send" autocomplete="off" aria-label="Message"></textarea>
    <div class="composer-bar">
      <span id="status-text" class="status-text"></span>
      <button type="button" id="stop" class="btn stop-btn" hidden>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
        <span>Stop</span>
      </button>
      <button type="button" id="send" class="send" aria-label="Send" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
      </button>
    </div>
  </div>
</footer>

<div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-panel">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="sheet-title">Sessions</h2>
      <button type="button" class="icon-btn" data-close aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <button type="button" id="new-session" class="new-session">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
      <span>New session</span>
    </button>
    <ul id="session-list" class="session-list"></ul>
  </div>
</div>
</body>
</html>
