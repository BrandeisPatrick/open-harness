<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/@harness/harness.css">
<style>
  :root { --sc-bubble: var(--bubble, var(--bg-300)); --sc-code: var(--code-bg, var(--bg-200)); --sc-code-hover: var(--code-hover, var(--bg-400)); }
  :root[data-theme="dark"] { --sc-bubble: var(--bubble, var(--bg-000)); --sc-code: var(--code-bg, var(--bg-300)); --sc-code-hover: var(--code-hover, rgba(222, 220, 208, 0.1)); }
  html, body { height: 100%; }
  /* A tab fills the side pane: the page lays itself out and scrolls the conversation, not the page */
  body { display: flex; flex-direction: column; padding: 0; overflow: hidden; background: var(--bg-100); }
  .wrap { width: 100%; max-width: 760px; margin: 0 auto; padding: 0 16px; }

  /* ---------- top: the context switch and New chat ---------- */
  .bar { flex: none; border-bottom: 1px solid var(--border-subtle); }
  .bar .wrap { display: flex; flex-direction: column; gap: 2px; padding-top: 10px; padding-bottom: 10px; }
  .bar-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 28px; }
  .ctx { display: inline-flex; align-items: center; gap: 8px; min-width: 0; color: var(--text-100); cursor: pointer; }
  .ctx span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .h-btn { margin-right: -6px; }
  .note { padding-left: 40px; }

  /* ---------- the conversation ---------- */
  .scroller { position: relative; flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  .thread { display: flex; flex-direction: column; padding-top: 16px; padding-bottom: 8px; }
  .msg { font-size: 14px; line-height: 20px; }
  .msg.user { display: flex; justify-content: flex-end; margin: 4px 0 16px; }
  .bubble { max-width: 85%; padding: 8px 14px; background: var(--sc-bubble); color: var(--text-100); border-radius: 18px 18px 4px 18px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.assistant { margin-bottom: 8px; color: var(--text-100); }
  .waiting { display: flex; align-items: center; gap: 8px; min-height: 20px; color: var(--text-400); font-size: 13px; }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 28px; margin-top: 2px; }
  .foot .info { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .foot .info .h-muted { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .actions { display: flex; gap: 2px; margin-right: -6px; opacity: 0; transition: opacity 0.12s; }
  .msg.assistant:hover .actions, .actions:focus-within { opacity: 1; }
  .actions .h-btn.done, .actions .h-btn.done .h-icon { color: var(--success); }
  @media (hover: none) { .actions { opacity: 1; } }
  /* Narrow pane: the actions keep their icons (and names as tooltips) so the usage line has room */
  @media (max-width: 520px) { .actions .lbl { display: none; } .actions .h-btn { width: 28px; padding: 0; } }

  .msg.error { display: flex; align-items: flex-start; gap: 10px; margin: 0 0 16px; padding: 10px 12px; border-radius: var(--r-card); background: var(--bg-200); border: 1px solid var(--border-subtle); font-size: 13px; line-height: 18px; }
  .msg.error > .h-icon { margin-top: 1px; color: var(--danger); }
  .msg.error .body { flex: 1 1 auto; min-width: 0; }
  .msg.error .what { color: var(--text-100); }
  .msg.error .hint { margin-top: 2px; color: var(--text-400); font-size: 12px; line-height: 16px; }
  .msg.error .h-btn { margin: -4px -4px -4px 0; }

  /* ---------- Markdown, as the chat shows it (the app's .md rules) ---------- */
  .md { overflow-wrap: anywhere; }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p, .md ul, .md ol, .md blockquote, .md pre, .md .code-block, .md .table-wrap { margin: 0 0 12px; }
  .md h1, .md h2 { margin: 20px 0 8px; font-size: 16px; line-height: 24px; font-weight: 600; }
  .md h3, .md h4, .md h5, .md h6 { margin: 16px 0 4px; font-size: 14px; line-height: 20px; font-weight: 600; }
  .md strong { font-weight: 600; }
  .md ul, .md ol { padding-left: 24px; }
  .md li { margin: 4px 0; }
  .md li::marker { color: var(--text-400); }
  .md li > ul, .md li > ol { margin: 4px 0 0; }
  .md code { font-family: var(--mono); font-size: 0.9em; padding: 1px 4px; border-radius: 4px; background: var(--sc-code); border: 1px solid var(--border-subtle); }
  .md blockquote { padding: 0 0 0 12px; border-left: 2px solid var(--border); color: var(--text-200); }
  .md hr { height: 1px; margin: 16px 0; border: none; background: var(--border-subtle); }
  .md del { color: var(--text-400); }
  .md pre { padding: 12px; overflow-x: auto; background: var(--sc-code); border: 1px solid var(--border-subtle); border-radius: var(--r-card); font: 12px/18px var(--mono); }
  .md .code-block { background: var(--sc-code); border: 1px solid var(--border-subtle); border-radius: var(--r-card); overflow: hidden; }
  .md .code-block pre { margin: 0; border: 0; border-radius: 0; background: none; }
  .md pre code, .md .code-block code { padding: 0; border: none; background: none; font-size: inherit; }
  .md .code-head { display: flex; align-items: center; justify-content: space-between; height: 32px; padding: 0 4px 0 12px; border-bottom: 1px solid var(--border-subtle); }
  .md .code-lang { font-size: 12px; line-height: 16px; color: var(--text-400); }
  .md .code-copy { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: var(--r-control); font-size: 12px; line-height: 16px; color: var(--text-400); }
  .md .code-copy:hover { background: var(--sc-code-hover); color: var(--text-100); }
  .md .code-copy.copied { color: var(--success); }
  .md .code-copy svg { width: 14px; height: 14px; }
  .md .table-wrap { overflow-x: auto; border: 1px solid var(--border-subtle); border-radius: var(--r-card); }
  .md table { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 18px; }
  .md th, .md td { padding: 6px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--border-subtle); }
  .md th { background: var(--bg-200); font-weight: 600; white-space: nowrap; }
  .md tbody tr:last-child td { border-bottom: none; }
  .md ul.tasks { padding-left: 4px; list-style: none; }
  .md li.task { display: flex; align-items: flex-start; gap: 8px; }
  .tok-kw { color: var(--tok-kw, #c0533a); } .tok-str { color: var(--tok-str, var(--success)); } .tok-com { color: var(--tok-com, var(--text-400)); font-style: italic; }
  .tok-num { color: var(--tok-num, #8a6d00); } .tok-pun { color: var(--tok-pun, var(--text-400)); }
  :root[data-theme="dark"] .tok-kw { color: var(--tok-kw, #e39678); } :root[data-theme="dark"] .tok-num { color: var(--tok-num, #ffd014); }
  /* The reply that is still arriving ends in a soft caret */
  .md.streaming > :last-child::after, .md.streaming:empty::after {
    content: ''; display: inline-block; width: 7px; height: 14px; margin-left: 2px; vertical-align: -2px; border-radius: 1px;
    background: var(--accent); animation: caret 1s ease-in-out infinite;
  }
  @keyframes caret { 50% { opacity: 0.25; } }

  /* ---------- nothing yet ---------- */
  .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100%; padding-top: 24px; padding-bottom: 24px; text-align: center; }
  .empty .mark { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; margin-bottom: 12px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); }
  .empty .mark .h-icon { width: 20px; height: 20px; }
  .empty h2 { margin: 0 0 6px; font-size: 16px; line-height: 22px; font-weight: 600; color: var(--text-100); }
  .empty p { max-width: 380px; color: var(--text-400); }
  .examples { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 420px; margin-top: 16px; }
  .example { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 36px; padding: 7px 12px; border: 1px solid var(--border-subtle); border-radius: var(--r-card); background: var(--bg-000); color: var(--text-200); text-align: left; box-shadow: var(--shadow-sm); transition: background-color 0.12s, color 0.12s, border-color 0.12s; }
  .example:hover { background: var(--surface-hover); color: var(--text-100); border-color: var(--border); }
  .example .h-icon { color: var(--text-400); }
  .example span { flex: 1 1 auto; min-width: 0; }

  .jump { position: sticky; bottom: 8px; display: flex; justify-content: center; height: 0; overflow: visible; pointer-events: none; }
  .jump .h-btn { transform: translateY(-36px); pointer-events: auto; border-radius: 999px; }

  /* ---------- the composer ---------- */
  .composer-wrap { flex: none; padding-bottom: 12px; }
  .composer { display: flex; align-items: flex-end; gap: 8px; padding: 8px 8px 8px 14px; border: 1px solid var(--border); border-radius: 16px; background: var(--bg-000); box-shadow: var(--shadow-sm); transition: border-color 0.12s, box-shadow 0.12s; }
  .composer:focus-within { border-color: var(--accent-line); box-shadow: 0 0 0 2px var(--field-ring); }
  .composer textarea { flex: 1 1 auto; min-width: 0; height: 22px; max-height: 200px; margin: 0 0 3px; padding: 2px 0 0; border: 0; outline: none; resize: none; background: transparent; font-size: 14px; line-height: 20px; color: var(--text-100); }
  .composer textarea::placeholder { color: var(--text-400); }
  .composer textarea:focus-visible { outline: none; }
  .send { width: 28px; height: 28px; padding: 0; border-radius: 8px; }
  .send .h-icon { width: 16px; height: 16px; }
  .send.stop { background: var(--text-100); color: var(--bg-100); }
  .send.stop:hover { background: var(--text-200); }
  .keys-hint { margin-top: 6px; text-align: center; }
  @media (max-width: 480px) { .keys-hint .keys { display: none; } }
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <div class="bar-row">
      <label class="ctx" title="Put the main conversation in front of your question (read-only)"><input type="checkbox" class="h-switch" id="ctx" checked><span>Include this session's conversation</span></label>
      <button class="h-btn ghost sm" id="new" title="Clear this side conversation">New chat</button>
    </div>
    <p class="h-muted note" id="note"></p>
  </div>
</header>

<main class="scroller" id="scroller">
  <div class="wrap thread" id="thread" aria-live="polite"></div>
  <div class="wrap empty" id="empty" hidden>
    <div class="mark" id="mark"></div>
    <h2>Ask on the side</h2>
    <p>A quick question that should not go into the session, like what a flag does or what an error means. The agent keeps working while you ask.</p>
    <div class="examples" id="examples"></div>
  </div>
  <div class="jump" id="jump" hidden><button class="h-btn sm" id="jump-btn">Jump to the latest</button></div>
</main>

<footer class="composer-wrap">
  <div class="wrap">
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Ask a quick question" aria-label="Your question"></textarea>
      <button class="h-btn primary send" id="send" aria-label="Send" title="Send (Enter)"></button>
    </div>
    <p class="h-muted keys-hint">Enter sends<span class="keys">, Shift+Enter starts a new line</span>. Esc stops an answer.</p>
  </div>
</footer>

<script src="/@harness/harness.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const svg = (d, cls = 'h-icon') => `<svg class="${cls}" viewBox="0 0 16 16" aria-hidden="true">${d}</svg>`;
  const ICON = {
    send: svg('<path d="M8 13V3.5M4 7.5l4-4 4 4"/>'),
    stop: svg('<rect x="4.5" y="4.5" width="7" height="7" rx="1.25" fill="currentColor" stroke="none"/>'),
    copy: svg('<rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 5.5V4A1.5 1.5 0 0 0 9 2.5H4A1.5 1.5 0 0 0 2.5 4v5A1.5 1.5 0 0 0 4 10.5h1.5"/>'),
    check: svg('<path d="M3.25 8.25l3 3 6.5-6.5"/>'),
    toMain: svg('<path d="M13.5 8H3.5M7.25 4.25L3.5 8l3.75 3.75"/>'),
    alert: svg('<circle cx="8" cy="8" r="6.25"/><path d="M8 4.75v3.75M8 11.1v.15"/>'),
    plus: svg('<path d="M8 3.25v9.5M3.25 8h9.5"/>'),
    message: svg('<path d="M3.25 3h9.5c.69 0 1.25.56 1.25 1.25v6c0 .69-.56 1.25-1.25 1.25H8.5l-3 2.5v-2.5H3.25C2.56 11.5 2 10.94 2 10.25v-6C2 3.56 2.56 3 3.25 3z"/>'),
    ask: svg('<path d="M3.25 3h9.5c.69 0 1.25.56 1.25 1.25v6c0 .69-.56 1.25-1.25 1.25H8.5l-3 2.5v-2.5H3.25C2.56 11.5 2 10.94 2 10.25v-6C2 3.56 2.56 3 3.25 3z"/>', 'h-icon sm'),
  };
  const EXAMPLES = [
    'What does the last error in the main chat mean?',
    'In two sentences, what is the agent doing right now?',
    'What does `git commit --no-verify` skip?',
  ];
  const SYSTEM = 'You answer a side question in a small panel next to a coding session. Answer briefly and directly, in Markdown. ' +
    'Nothing said here is added to the main conversation, and you cannot act on the project from here.';
  const MAX_STORED = 200 * 1024; // a stored value may be up to 256 KB

  /** messages: { role: 'user' | 'assistant' | 'error', content, stopped?, usage?, interrupted?, code? } */
  let messages = [];
  let include = true;
  let sessionTitle = '';
  let sessionId = null;
  let loaded = false;
  let epoch = 0; // bumped on a session switch or New chat: late answers for an older conversation are dropped
  let live = null; // { epoch, msg, el, md } while a reply streams
  let stick = true; // follow the bottom while a reply streams, unless the user scrolled up
  const htmlCache = new WeakMap();

  const fmt = (n) => Math.max(0, Math.round(Number(n) || 0)).toLocaleString();

  // ---------- storage ----------

  function save() {
    if (!loaded) return;
    // Keep the newest messages that fit; a single answer longer than the budget is cut
    let list = messages.map((m) => {
      const o = { role: m.role, content: m.content };
      if (m.stopped) o.stopped = true;
      if (m.usage) o.usage = m.usage;
      if (m.interrupted) o.interrupted = true;
      if (m.code) o.code = m.code;
      if (m.hint) o.hint = m.hint;
      return o;
    });
    while (list.length > 1 && JSON.stringify(list).length > MAX_STORED) list = list.slice(list[0].role === 'user' && list[1] && list[1].role !== 'user' ? 2 : 1);
    if (list.length === 1 && JSON.stringify(list).length > MAX_STORED) list[0].content = list[0].content.slice(0, MAX_STORED / 2);
    const value = { v: 1, messages: list };
    (list.length ? harness.storage.session.set('chat', value) : harness.storage.session.remove('chat')).catch(() => {});
  }

  async function loadConversation() {
    const mine = epoch;
    let stored = null;
    try { stored = await harness.storage.session.get('chat', null); } catch (e) { stored = null; }
    if (mine !== epoch) return;
    const list = stored && Array.isArray(stored.messages) ? stored.messages : [];
    messages = list.filter((m) => m && typeof m.content === 'string' && (m.role === 'user' || m.role === 'assistant' || m.role === 'error'));
    // An answer that was still empty when the user switched away becomes a row that offers to ask again
    const tail = messages[messages.length - 1];
    if (tail && tail.role === 'assistant' && tail.interrupted && !tail.content) {
      messages[messages.length - 1] = { role: 'error', code: 'interrupted', content: 'The answer stopped when another session came on screen.', hint: 'Try again to ask the same question.' };
    }
    loaded = true;
    stick = true;
    render();
    scrollToEnd();
  }

  async function loadSession() {
    try {
      const s = await harness.session.get();
      sessionId = s && s.id;
      sessionTitle = (s && s.title) || '';
    } catch (e) { sessionTitle = ''; }
    renderNote();
  }

  // ---------- rendering ----------

  function renderNote() {
    const t = sessionTitle ? `“${sessionTitle.length > 60 ? sessionTitle.slice(0, 60) + '…' : sessionTitle}”` : 'the main conversation';
    $('note').textContent = include
      ? `The model can see ${t}. Nothing said here is added to it.`
      : 'The model sees only this side chat. Nothing said here is added to the main conversation.';
    $('ctx').checked = include;
  }

  function button(label, icon, title, onClick) {
    const b = document.createElement('button');
    b.className = 'h-btn ghost sm';
    b.innerHTML = icon;
    const l = document.createElement('span');
    l.className = 'lbl';
    l.textContent = label;
    b.appendChild(l);
    b.title = title;
    b.setAttribute('aria-label', label);
    b.onclick = onClick;
    return b;
  }

  function flash(b, label) {
    const before = b.innerHTML;
    b.innerHTML = ICON.check;
    const l = document.createElement('span');
    l.className = 'lbl';
    l.textContent = label;
    b.appendChild(l);
    b.classList.add('done');
    setTimeout(() => { b.innerHTML = before; b.classList.remove('done'); }, 1500);
  }

  function setMarkdown(el, msg) {
    const cached = htmlCache.get(msg);
    if (cached && cached.text === msg.content) { el.innerHTML = cached.html; return; }
    el.textContent = msg.content; // until the renderer answers
    el.style.whiteSpace = 'pre-wrap';
    harness.ui.markdown(msg.content).then((r) => {
      htmlCache.set(msg, { text: msg.content, html: r.html });
      if (!el.isConnected) return;
      el.style.whiteSpace = '';
      el.innerHTML = r.html;
      if (stick) scrollToEnd();
    }, () => {});
  }

  function assistantEl(msg, isLast) {
    const wrap = document.createElement('div');
    wrap.className = 'msg assistant';
    const md = document.createElement('div');
    md.className = 'md';
    wrap.appendChild(md);
    if (msg === (live && live.msg)) {
      md.classList.add('streaming');
      if (!msg.content) {
        md.classList.remove('streaming');
        const w = document.createElement('div');
        w.className = 'waiting';
        w.innerHTML = '<span class="h-spin sm"></span>';
        w.appendChild(document.createTextNode('Thinking'));
        md.appendChild(w);
      } else setMarkdown(md, msg);
      live.el = wrap;
      live.md = md;
      return wrap;
    }
    if (msg.content) setMarkdown(md, msg);
    const foot = document.createElement('div');
    foot.className = 'foot';
    const info = document.createElement('div');
    info.className = 'info';
    if (msg.stopped || msg.interrupted) {
      const chip = document.createElement('span');
      chip.className = 'h-chip';
      chip.textContent = msg.interrupted ? 'Interrupted' : 'Stopped';
      chip.title = msg.interrupted ? 'Another session came on screen before the answer finished' : 'You stopped this answer';
      info.appendChild(chip);
    }
    if (isLast && msg.usage) {
      const u = document.createElement('span');
      u.className = 'h-muted';
      const inT = msg.usage.promptTokens;
      const outT = msg.usage.completionTokens;
      u.textContent = `${fmt(inT)} tokens in · ${fmt(outT)} out`;
      u.title = 'Tokens the last reply used';
      info.appendChild(u);
    }
    foot.appendChild(info);
    if (msg.content) {
      const actions = document.createElement('div');
      actions.className = 'actions';
      const copy = button('Copy', ICON.copy, 'Copy this answer', async () => {
        try { await harness.ui.copy(msg.content); flash(copy, 'Copied'); } catch (e) { harness.ui.toast(e.message, { kind: 'error' }); }
      });
      const send = button('Send to main chat', ICON.toMain, 'Put this answer in the main composer; you decide whether to send it', async () => {
        try { await harness.composer.insert(msg.content); flash(send, 'In the composer'); } catch (e) { harness.ui.toast(e.message, { kind: 'error' }); }
      });
      actions.append(copy, send);
      foot.appendChild(actions);
    }
    if (info.childNodes.length || msg.content) wrap.appendChild(foot);
    return wrap;
  }

  function errorEl(msg, isLast) {
    const row = document.createElement('div');
    row.className = 'msg error';
    row.setAttribute('role', 'alert');
    row.innerHTML = ICON.alert;
    const body = document.createElement('div');
    body.className = 'body';
    const what = document.createElement('div');
    what.className = 'what';
    what.textContent = msg.content;
    body.appendChild(what);
    if (msg.hint) { const h = document.createElement('div'); h.className = 'hint'; h.textContent = msg.hint; body.appendChild(h); }
    row.appendChild(body);
    if (isLast && !live) {
      const retry = document.createElement('button');
      retry.className = 'h-btn sm';
      retry.textContent = 'Try again';
      retry.onclick = () => { messages.pop(); ask(); };
      row.appendChild(retry);
    }
    return row;
  }

  function render() {
    const thread = $('thread');
    thread.textContent = '';
    const empty = loaded && !messages.length;
    $('empty').hidden = !empty;
    thread.hidden = empty;
    messages.forEach((m, i) => {
      const last = i === messages.length - 1;
      if (m.role === 'user') {
        const row = document.createElement('div');
        row.className = 'msg user';
        const b = document.createElement('div');
        b.className = 'bubble';
        b.textContent = m.content;
        row.appendChild(b);
        thread.appendChild(row);
      } else if (m.role === 'assistant') thread.appendChild(assistantEl(m, last || (i === messages.length - 2 && messages[i + 1].role === 'error')));
      else thread.appendChild(errorEl(m, last));
    });
    renderComposer();
  }

  function renderComposer() {
    const streaming = !!live;
    const send = $('send');
    send.classList.toggle('stop', streaming);
    send.classList.toggle('primary', !streaming);
    send.innerHTML = streaming ? ICON.stop : ICON.send;
    send.setAttribute('aria-label', streaming ? 'Stop the answer' : 'Send');
    send.title = streaming ? 'Stop (Esc)' : 'Send (Enter)';
    send.disabled = !streaming && !$('input').value.trim();
    $('new').disabled = !messages.length && !streaming;
  }

  // ---------- scrolling ----------

  const scroller = $('scroller');
  function atBottom() { return scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 24; }
  function scrollToEnd() { scroller.scrollTop = scroller.scrollHeight; stick = true; $('jump').hidden = true; }
  scroller.addEventListener('scroll', () => {
    stick = atBottom();
    $('jump').hidden = stick || !live;
  }, { passive: true });
  $('jump-btn').onclick = scrollToEnd;

  // ---------- talking to the model ----------

  /** The conversation as the model takes it: user and assistant turns, alternating, starting with the user. */
  function apiMessages() {
    const out = [];
    for (const m of messages) {
      if (m.role !== 'user' && m.role !== 'assistant') continue;
      const content = (m.content || '').trim();
      if (!content) continue;
      const prev = out[out.length - 1];
      if (prev && prev.role === m.role) prev.content += '\n\n' + content;
      else out.push({ role: m.role, content });
    }
    while (out.length && out[0].role !== 'user') out.shift();
    return out;
  }

  function explain(e) {
    const msg = (e && e.message) || '';
    if (e && e.code === 'permission') {
      return { content: 'Side chat is not allowed to ' + (e.permission === 'model' || !e.permission ? 'use the model.' : `use “${e.permission}”.`), hint: 'Turn the permission on in Settings → Mods → Side chat, then try again.' };
    }
    if (e && e.code === 'unavailable') return { content: msg || 'The model is not available right now.', hint: /settings/i.test(msg) ? 'Then try again.' : 'Check the provider and key in Settings → Model, then try again.' };
    if (e && e.code === 'bad-params') return { content: msg || 'The model refused the request.', hint: 'Start a new chat if this conversation has grown too long.' };
    return { content: msg || 'The model could not answer.', hint: 'Check that the model is reachable in Settings → Model, then try again.' };
  }

  async function ask() {
    const request = apiMessages();
    if (!request.length || request[request.length - 1].role !== 'user') { render(); return; }
    const mine = epoch;
    const msg = { role: 'assistant', content: '' };
    messages.push(msg);
    live = { epoch: mine, msg, el: null, md: null };
    stick = true;
    render();
    scrollToEnd();
    // Saved now so a switch mid-answer leaves "Interrupted" behind rather than a question without an answer
    msg.interrupted = true;
    save();
    delete msg.interrupted;

    let pending = false;
    let dirty = false;
    const paint = () => {
      if (!live || live.msg !== msg) return;
      if (pending) { dirty = true; return; }
      if (!live.md || !live.md.classList.contains('streaming')) { render(); if (stick) scrollToEnd(); return; }
      pending = true;
      const text = msg.content;
      harness.ui.markdown(text).then((r) => {
        if (live && live.msg === msg && live.md) {
          live.md.style.whiteSpace = '';
          live.md.innerHTML = r.html;
          htmlCache.set(msg, { text, html: r.html });
        }
      }, () => {
        if (live && live.msg === msg && live.md) { live.md.style.whiteSpace = 'pre-wrap'; live.md.textContent = text; }
      }).then(() => {
        pending = false;
        if (stick) scrollToEnd();
        if (dirty) { dirty = false; paint(); }
      });
    };

    let result = null;
    let error = null;
    try {
      result = await harness.model.complete({ messages: request, system: SYSTEM, maxTokens: 2000, context: include ? 'session' : 'none' }, (delta) => {
        if (mine !== epoch || !live || live.msg !== msg) return;
        msg.content += delta;
        paint();
      });
    } catch (e) { error = e; }
    if (mine !== epoch) return; // another session or a new chat: this answer belongs to a conversation that is gone
    live = null;
    if (error) {
      messages.pop();
      if (msg.content) { msg.stopped = true; messages.push(msg); }
      messages.push(Object.assign({ role: 'error', code: error.code || 'error' }, explain(error)));
    } else {
      // The result's text is authoritative (deltas may have been dropped)
      if (result && typeof result.text === 'string' && result.text.length >= msg.content.length) msg.content = result.text;
      if (result && result.stopped) msg.stopped = true;
      if (result && result.usage) msg.usage = result.usage;
      if (!msg.content) { messages.pop(); if (!(result && result.stopped)) messages.push({ role: 'error', code: 'empty', content: 'The model sent an empty answer.', hint: 'Try asking again, or rephrase the question.' }); }
    }
    save();
    render();
    if (stick) scrollToEnd();
  }

  function send() {
    if (live) return;
    const input = $('input');
    const text = input.value.trim();
    if (!text) return;
    // A failed turn at the end is replaced by the new question
    while (messages.length && messages[messages.length - 1].role === 'error') messages.pop();
    messages.push({ role: 'user', content: text });
    input.value = '';
    grow();
    ask();
  }

  function stop() {
    if (!live) return;
    harness.model.cancel().catch(() => {});
  }

  /** Session switch or New chat: whatever is streaming stops and is forgotten. */
  function reset() {
    epoch++;
    if (live) harness.model.cancel().catch(() => {});
    live = null;
    messages = [];
  }

  // ---------- the composer ----------

  function grow() {
    const t = $('input');
    t.style.height = 'auto';
    t.style.height = Math.min(t.scrollHeight, 200) + 'px';
    renderComposer();
  }
  $('input').addEventListener('input', grow);
  $('input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); send(); }
    else if (e.key === 'Escape' && live) { e.preventDefault(); stop(); }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && live && e.target !== $('input')) stop(); });
  $('send').onclick = () => (live ? stop() : send());
  $('new').innerHTML = ICON.plus;
  $('new').appendChild(document.createTextNode('New chat'));
  $('new').onclick = () => {
    reset();
    loaded = true;
    save();
    render();
    $('input').focus();
  };
  $('ctx').onchange = (e) => {
    include = e.target.checked;
    harness.storage.set('includeSession', include).catch(() => {});
    renderNote();
  };

  $('mark').innerHTML = ICON.message;
  EXAMPLES.forEach((q) => {
    const b = document.createElement('button');
    b.className = 'example';
    b.innerHTML = ICON.ask;
    const s = document.createElement('span');
    s.textContent = q;
    b.appendChild(s);
    b.title = 'Put this question in the field';
    b.onclick = () => { const t = $('input'); t.value = q; grow(); t.focus(); t.setSelectionRange(q.length, q.length); };
    $('examples').appendChild(b);
  });

  // Links open in the browser; code blocks from the app's renderer have a Copy button
  $('thread').addEventListener('click', async (e) => {
    const a = e.target.closest('a[href]');
    if (a) {
      e.preventDefault();
      if (/^https?:/i.test(a.getAttribute('href'))) harness.ui.openExternal(a.getAttribute('href')).catch(() => {});
      return;
    }
    const c = e.target.closest('.code-copy');
    if (c) {
      const code = c.closest('.code-block') && c.closest('.code-block').querySelector('pre');
      if (!code) return;
      try { await harness.ui.copy(code.textContent); c.classList.add('copied'); setTimeout(() => c.classList.remove('copied'), 1500); } catch (err) { harness.ui.toast(err.message, { kind: 'error' }); }
    }
  });

  // ---------- following the session ----------

  harness.on('session.switched', (d) => {
    if (d && d.id === sessionId) return;
    sessionId = d && d.id;
    reset();
    loaded = false;
    render();
    loadConversation();
    loadSession();
  });
  harness.on('session.changed', (s) => {
    if (!s || s.id !== sessionId) return; // a switch is handled by session.switched
    if (s.title !== sessionTitle) { sessionTitle = s.title || ''; renderNote(); }
  });

  renderNote();
  renderComposer();
  harness.ready.then(async () => {
    include = (await harness.storage.get('includeSession', true).catch(() => true)) !== false;
    renderNote();
    await Promise.all([loadSession(), loadConversation()]);
  });
</script>
</body>
</html>
