<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/@harness/harness.css">
<style>
  /* Rows as in Claude Code's Environment section: a 16 px outline icon in --text-400, a 14 px label in --text-100,
     secondary text after a middle dot in --text-400, 32 px rows */
  .info { display: flex; align-items: center; gap: 10px; min-height: 32px; min-width: 0; }
  .info > .h-icon { color: var(--text-400); }
  .info .main { flex: 0 1 auto; min-width: 0; max-width: 70%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-100); }
  .info .main.grow { max-width: none; }
  .info .dot { flex: none; margin: 0 -4px; color: var(--text-400); }
  /* The path is cut from the left, so its end (the part that tells folders apart) stays */
  .info .sub { flex: 1 1 0; min-width: 24px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; color: var(--text-400); }
  .info .end { flex: none; margin-left: auto; }
  .info .gear { margin-right: -6px; }
  .info .gear .h-icon { width: 16px; height: 16px; color: var(--text-400); }
  .info .gear:hover .h-icon { color: var(--text-100); }
  .ctl { cursor: pointer; }
  /* The switch as in the reference: 28 × 16 with a 12 px knob */
  .ctl input.h-switch { width: 28px; height: 16px; }
  .ctl input.h-switch::before { width: 12px; height: 12px; }
  .ctl input.h-switch:checked::before { transform: translateX(12px); }
  .remote { margin: 0 0 4px 26px; }
  .link { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .link .url { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-200); }
  .link .h-btn { margin-right: -6px; }
  .devices { display: flex; align-items: center; gap: 6px; margin-top: 1px; }
  .devices .h-dot { --dot: var(--success); width: 6px; height: 6px; }
  .devices.none .h-dot { --dot: var(--text-400); opacity: 0.6; }
  .error { color: var(--danger); font-size: var(--fs-small); line-height: var(--lh-small); }
</style>
</head>
<body>
<div id="root" hidden>
  <div class="info" id="folder"></div>
  <div class="info" id="repo" hidden></div>
  <div class="info" id="branch" hidden></div>
  <div class="info" id="model"></div>
  <label class="info ctl" id="remote-row"><span id="remote-icon"></span><span class="main grow">Remote control</span><input type="checkbox" class="h-switch end" id="remote-switch"></label>
  <div class="remote" id="remote" hidden>
    <div class="link" id="link" hidden><span class="url h-mono" id="url"></span><button class="h-btn ghost sm icon" id="copy" title="Copy the link" aria-label="Copy the link"></button></div>
    <div class="devices h-muted" id="devices"></div>
    <div class="error" id="remote-error" hidden></div>
  </div>
</div>
<p class="h-empty" id="empty" hidden>Loading…</p>
<script src="/@harness/harness.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const svg = (d) => `<svg class="h-icon" viewBox="0 0 16 16" aria-hidden="true">${d}</svg>`;
  const ICON = {
    folder: svg('<path d="M2 4.5C2 3.67 2.67 3 3.5 3h2.67c.4 0 .78.16 1.06.44L8.5 4.75h4c.83 0 1.5.67 1.5 1.5v5.25c0 .83-.67 1.5-1.5 1.5h-9c-.83 0-1.5-.67-1.5-1.5v-7z"/>'),
    repo: svg('<path d="M3.25 12.25V3.5c0-.97.78-1.75 1.75-1.75h7.75v9.5H5c-.97 0-1.75.78-1.75 1.75zm0 0c0 .97.78 1.75 1.75 1.75h7.75"/><path d="M6 1.75v5l1.25-1 1.25 1v-5"/>'),
    branch: svg('<circle cx="4.5" cy="3.5" r="1.5"/><circle cx="11.5" cy="3.5" r="1.5"/><circle cx="8" cy="12.5" r="1.5"/><path d="M4.5 5v1c0 1.1.9 2 2 2h3c1.1 0 2-.9 2-2V5M8 8v3"/>'),
    model: svg('<path d="M6.5 2.25c.35 2.6 1.65 3.9 4.25 4.25-2.6.35-3.9 1.65-4.25 4.25-.35-2.6-1.65-3.9-4.25-4.25 2.6-.35 3.9-1.65 4.25-4.25z"/><path d="M12 9.75c.15 1.1.65 1.6 1.75 1.75-1.1.15-1.6.65-1.75 1.75-.15-1.1-.65-1.6-1.75-1.75 1.1-.15 1.6-.65 1.75-1.75z"/>'),
    remote: svg('<path d="M4 2.75l8.25 5.5-3.6.75 2.1 3.9-1.55.85-2.1-3.9-3.1 2.4V2.75z"/>'),
    gear: svg('<path d="M6.49 3.34L6.76 1.62A6.5 6.5 0 0 1 9.24 1.62L9.51 3.34A4.9 4.9 0 0 1 11.28 4.36L12.91 3.74A6.5 6.5 0 0 1 14.15 5.88L12.79 6.98A4.9 4.9 0 0 1 12.79 9.02L14.15 10.12A6.5 6.5 0 0 1 12.91 12.26L11.28 11.64A4.9 4.9 0 0 1 9.51 12.66L9.24 14.38A6.5 6.5 0 0 1 6.76 14.38L6.49 12.66A4.9 4.9 0 0 1 4.72 11.64L3.09 12.26A6.5 6.5 0 0 1 1.85 10.12L3.21 9.02A4.9 4.9 0 0 1 3.21 6.98L1.85 5.88A6.5 6.5 0 0 1 3.09 3.74L4.72 4.36A4.9 4.9 0 0 1 6.49 3.34Z"/><circle cx="8" cy="8" r="2"/>'),
    copy: svg('<rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 5.5V4A1.5 1.5 0 0 0 9 2.5H4A1.5 1.5 0 0 0 2.5 4v5A1.5 1.5 0 0 0 4 10.5h1.5"/>'),
    check: svg('<path d="M3.25 8.25l3 3 6.5-6.5"/>'),
  };
  const PROVIDERS = { ollama: 'Ollama', portkey: 'Portkey', openai: 'OpenAI', anthropic: 'Anthropic' };

  let config = null;
  let git = null;
  let remote = null;
  let remoteBusy = false;
  let remoteError = '';
  let copiedTimer = null;

  /** A path under the user's home folder (config.home) becomes ~/… */
  function tilde(p, home) {
    p = p || '';
    home = String(home || '').replace(/\/+$/, '');
    if (!home) return p;
    if (p === home) return '~';
    return p.startsWith(home + '/') ? '~' + p.slice(home.length) : p;
  }
  function base(p) {
    const parts = String(p || '').replace(/\/+$/, '').split('/');
    return parts[parts.length - 1] || '/';
  }
  function parent(p) {
    const s = String(p || '').replace(/\/+$/, '');
    const i = s.lastIndexOf('/');
    return i > 0 ? s.slice(0, i) : i === 0 ? '/' : '';
  }
  /** A row: icon, the label, and optionally " · " and secondary text */
  function info(el, icon, main, sub, title) {
    el.innerHTML = icon;
    const a = document.createElement('span');
    a.className = 'main' + (sub ? '' : ' grow');
    a.textContent = main;
    el.appendChild(a);
    if (sub) {
      const d = document.createElement('span'); d.className = 'dot'; d.textContent = '·'; el.appendChild(d);
      // LRM marks keep the path's own order inside the right-to-left box that cuts it from the left
      const b = document.createElement('span'); b.className = 'sub'; b.textContent = `‎${sub}‎`; el.appendChild(b);
    }
    el.title = title || '';
  }

  function render() {
    $('root').hidden = !config;
    $('empty').hidden = !!config;
    if (!config) return;
    const dir = config.workingDirectory || '';
    info($('folder'), ICON.folder, dir ? base(dir) : 'No folder', dir ? tilde(parent(dir), config.home) : '', dir);
    const gear = document.createElement('button');
    gear.className = 'h-btn ghost sm icon gear end';
    gear.id = 'settings';
    gear.title = 'Settings';
    gear.setAttribute('aria-label', 'Settings');
    gear.innerHTML = ICON.gear;
    gear.onclick = () => harness.ui.openSettings('general').catch((e) => harness.ui.toast(e.message, { kind: 'error' }));
    $('folder').appendChild(gear);

    const repo = git && git.repository;
    $('repo').hidden = !repo;
    if (repo) info($('repo'), ICON.repo, repo, '', git.root ? `Repository: ${repo}\n${git.root}` : repo);
    const branch = git && git.branch;
    $('branch').hidden = !branch;
    if (branch) info($('branch'), ICON.branch, branch, '', `Branch: ${branch}`);

    const provider = PROVIDERS[config.provider] || config.provider || '';
    info($('model'), ICON.model, [provider, config.model].filter(Boolean).join(' · ') || 'No model', '', `Provider: ${provider || '—'}\nModel: ${config.model || '—'}`);

    const r = remote;
    const sw = $('remote-switch');
    sw.checked = !!(r && r.enabled);
    sw.disabled = remoteBusy || !r;
    const url = r && r.running && Array.isArray(r.urls) && r.urls[0];
    $('remote').hidden = !(r && (r.enabled || remoteError));
    $('link').hidden = !url;
    $('url').textContent = url || '';
    $('url').title = url || '';
    const n = (r && r.clients) || 0;
    const dev = $('devices');
    dev.hidden = !(r && r.enabled);
    dev.classList.toggle('none', !n);
    dev.innerHTML = '<span class="h-dot"></span>';
    dev.appendChild(document.createTextNode(
      r && r.enabled && !r.running ? (r.error ? 'Not running' : 'Starting…') : n === 0 ? 'No devices connected' : n === 1 ? '1 device connected' : `${n} devices connected`));
    const err = remoteError || (r && r.enabled && r.error) || '';
    $('remote-error').hidden = !err;
    $('remote-error').textContent = err;
  }

  // The repository and branch of the session's folder, read again when the folder or the session changes and after a
  // run (the agent may have switched branches)
  let gitFor = null;
  async function loadGit(force) {
    const dir = config && config.workingDirectory;
    if (!force && dir === gitFor) return;
    gitFor = dir;
    const g = await harness.project.git().catch(() => null);
    if ((config && config.workingDirectory) !== dir) return;
    git = g;
    render();
  }

  $('remote-icon').outerHTML = ICON.remote;
  $('copy').innerHTML = ICON.copy;
  $('copy').onclick = async () => {
    const url = $('url').textContent;
    if (!url) return;
    try { await harness.ui.copy(url); } catch (e) { harness.ui.toast(e.message, { kind: 'error' }); return; }
    $('copy').innerHTML = ICON.check;
    clearTimeout(copiedTimer);
    copiedTimer = setTimeout(() => { $('copy').innerHTML = ICON.copy; }, 1500);
  };

  $('remote-switch').onchange = async (e) => {
    const on = e.target.checked;
    remoteBusy = true;
    remoteError = '';
    render();
    try { remote = await (on ? harness.remote.start() : harness.remote.stop()); } catch (err) { remoteError = err.message; }
    remoteBusy = false;
    render();
  };

  harness.on('config.changed', (c) => { if (c) { config = c; render(); loadGit(false); } });
  // workingDirectory is the folder of the session on screen, so read it again when another session comes on screen
  harness.on('session.switched', async () => {
    const c = await harness.config.get().catch(() => null);
    if (c) { config = c; render(); loadGit(true); }
  });
  harness.on('run.ended', () => loadGit(true));
  harness.on('remote.changed', (r) => { if (r) { remote = r; remoteError = ''; render(); } });
  harness.ready.then(async () => {
    const [c, r] = await Promise.all([harness.config.get().catch(() => null), harness.remote.status().catch(() => null)]);
    config = c || { workingDirectory: '', provider: '', model: '', permissionMode: 'ask' };
    remote = r;
    render();
    loadGit(true);
  });
</script>
</body>
</html>
